model:
  name: mlp                  # softmax | mlp | cnn
  params:
    hidden_dim: [2048, 1024, 512, 256]  # sizes of hidden layers
    dropout: 0.0

data:
  batch_size: 128
  val_size: 10000
  split_seed: 912           # fixed train/val split, keep unchanged across runs
  augment: false
  num_workers: 4

train:
  epochs: 30
  lr: 1.0e-3
  weight_decay: 0.0
  sched: none               # none | cosine
  eval_every: 1             # evaluate on val every N epochs (last epoch always evaluated)
  seed: 912

output:
  root: outputs/runs        # each run writes to <root>/<model>_aug<0|1>_s<seed>_<datetime>/
  n_error_samples: 32       # misclassified val images shown in error_samples.png
