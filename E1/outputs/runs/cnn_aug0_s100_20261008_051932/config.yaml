model:
  name: cnn
  params:
    channels:
    - 64
    - 128
    - 256
    - 512
data:
  batch_size: 128
  val_size: 10000
  split_seed: 912
  augment: false
  num_workers: 4
train:
  epochs: 100
  lr: 0.001
  weight_decay: 0.0
  sched: none
  eval_every: 1
  seed: 100
output:
  root: outputs/runs
  n_error_samples: 32
