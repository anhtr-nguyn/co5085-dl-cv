model:
  arch: deit_s
  mode: full
  drop_path: 0.1
data:
  batch_size: 128
  split_seed: 912
  augment: standard
  num_workers: 14
train:
  epochs: 30
  lr: 3e-4
  weight_decay: 0.05
  warmup_frac: 0.05
  grad_clip: 1.0
  label_smoothing: 0.1
  amp: bf16
  seed: 42
  eval_test: true
output:
  root: outputs/runs
